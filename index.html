<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanças">
<title>Finanças</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

</head>
<body>
<header class="topbar"><h1 id="title">Início</h1></header>
<main id="view"></main>
<nav class="tabbar">
  <button data-tab="inicio" class="active"><span>🏠</span>Início</button>
  <button data-tab="mes"><span>📅</span>Mês</button>
  <button class="add" data-action="novo" aria-label="Lançar">+</button>
  <button data-tab="fixos"><span>🔁</span>Fixos</button>
  <button data-tab="mais"><span>☰</span>Mais</button>
</nav>
<div id="sheet" class="sheet hidden"><div class="sheet-bg" data-action="fechar"></div><div class="sheet-card" id="sheet-card"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
